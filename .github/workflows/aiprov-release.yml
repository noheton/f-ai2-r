# aiprov release template — scaffolded by `provlog.py init --ci`.
# On every version tag (v*), gate on graph conformance, rebuild the
# disclosure from the graph, compile the paper, and publish a GitHub
# Release carrying the PDF, the provenance graph it was built from, the
# dashboard, the packaged skill, and sha256 checksums — so a release is
# always the artefact PLUS the record that produced it.
# Paths assume the skill layout (scripts/ at repo root, LaTeX in paper/).
name: aiprov release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created at the current commit if absent)"
        required: true
        default: "v0.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt

      - name: Gate on graph conformance
        run: python3 scripts/provlog.py validate

      - name: Regenerate AI-transparency disclosure from the graph (EU AI Act)
        run: |
          python3 scripts/provlog.py disclosure --format tex -o paper/disclosure.tex \
            || echo "disclosure skipped (no AI agents recorded yet)"

      - name: Compile LaTeX to PDF
        if: ${{ hashFiles('paper/main.tex') != '' }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Compile QSS journal variant to PDF
        if: ${{ hashFiles('paper-qss/main.tex') != '' }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper-qss

      - name: Build arXiv source bundle
        if: ${{ hashFiles('scripts/build_arxiv.py') != '' }}
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            ghcr.io/xu-cheng/texlive-full:latest \
            sh -c "apk add --no-cache python3 poppler-utils >/dev/null 2>&1 || true; python3 scripts/build_arxiv.py && { [ -d paper-qss ] && python3 scripts/build_arxiv.py --variant qss || true; }"
          # the container runs as root; hand dist/ back to the runner user
          # so later steps (skill packaging) can write into it
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Build provenance dashboard
        run: python3 scripts/build_dashboard.py provenance.ttl -o dashboard.html

      - name: Package the skill
        run: sh scripts/package_skill.sh || echo "::warning::skill packaging failed or not applicable"

      - name: Assemble release payload with checksums
        run: |
          mkdir -p release
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          [ -f paper/main.pdf ] && cp paper/main.pdf "release/paper-${TAG}.pdf"
          [ -f paper-qss/main.pdf ] && cp paper-qss/main.pdf "release/paper-qss-${TAG}.pdf"
          cp provenance.ttl "release/provenance-${TAG}.ttl"
          cp dashboard.html "release/dashboard-${TAG}.html"
          [ -f doc/metrics.json ] && cp doc/metrics.json "release/metrics-${TAG}.json"
          [ -f dist/ai-provenance.skill ] && cp dist/ai-provenance.skill release/
          for f in dist/arxiv-[0-9]*.tar.gz; do [ -f "$f" ] && cp "$f" "release/arxiv-${TAG}.tar.gz" && break; done
          for f in dist/arxiv-qss-*.tar.gz; do [ -f "$f" ] && cp "$f" "release/arxiv-qss-${TAG}.tar.gz" && break; done
          (cd release && sha256sum * > "checksums-${TAG}.sha256")
          {
            echo "Release ${TAG} — artefact plus the record that produced it."
            echo
            echo "| Asset | What |"
            echo "|---|---|"
            echo "| paper-${TAG}.pdf | The typeset paper (IEEE variant), built by this workflow |"
            echo "| paper-qss-${TAG}.pdf | QSS journal variant (single column, author-year, extended material) |"
            echo "| provenance-${TAG}.ttl | The provenance graph the build was gated on |"
            echo "| dashboard-${TAG}.html | Self-contained ledger view of the graph |"
            echo "| metrics-${TAG}.json | Machine-derived quantities the paper cites |"
            echo "| ai-provenance.skill | The method, packaged (Agent Skills format) |"
            echo "| arxiv-${TAG}.tar.gz | arXiv-ready flattened source bundle, IEEE variant (compile-verified) |"
            echo "| arxiv-qss-${TAG}.tar.gz | arXiv-ready flattened source bundle, QSS variant with extended material |"
            echo "| checksums-${TAG}.sha256 | sha256 of every asset above |"
            echo
            echo "Conformance: \`provlog.py validate\` passed on this commit."
            echo "The disclosure statement in the PDF was regenerated from the"
            echo "graph by this workflow (EU AI Act transparency)."
          } > release/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release/notes.md
          files: |
            release/paper-*.pdf
            release/provenance-*.ttl
            release/dashboard-*.html
            release/metrics-*.json
            release/ai-provenance.skill
            release/arxiv-*.tar.gz
            release/checksums-*.sha256

      # Archive the release on Zenodo as a new version of the existing
      # deposit (concept DOI 10.5281/zenodo.21667683). Requires the
      # repository secret ZENODO_TOKEN (personal access token with
      # deposit:write + deposit:actions); skips silently when absent so
      # forks and token-less runs stay green.
      - name: Archive release on Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ZENODO_TOKEN not set; skipping Zenodo archive"
            exit 0
          fi
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          python3 scripts/zenodo_archive.py --tag "$TAG" release/*
